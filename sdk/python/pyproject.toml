[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mirelth-synth"
version = "2.0.0"
description = "Synth AI Agent Framework - Python Remote HTTP Client (Mirelth / Synth; lightweight REST API client, not a full SDK)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff"]

[tool.setuptools.packages.find]
include = ["synth*"]
