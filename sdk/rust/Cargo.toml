[package]
name = "mirelth-synth"
version = "2.0.0"
edition = "2021"
description = "Synth Remote HTTP Client for Rust (Mirelth / Synth; lightweight REST API client, not a full SDK)"

[lib]
name = "synth"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
thiserror = "2"
